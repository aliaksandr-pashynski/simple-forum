spring:
  application:
    name: forum

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://192.168.100.6:30003/keycloak/realms/forum-dev/protocol/openid-connect/certs

  datasource:
    url: "jdbc:postgresql://${PG_DB_HOST}:${PG_DB_PORT}/${PG_DB_NAME}"
    driver-class-name: "org.postgresql.Driver"
    username: ${PG_DB_USERNAME}
    password: ${PG_DB_PASSWORD}

  kafka:
    template:
      default-topic: forum-dev
    producer:
      bootstrap-servers: 192.168.100.6:30005
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

server:
  servlet:
    context-path: /forum-service

topics:
  max-page-size: 20
posts:
  max-page-size: 20

minio:
  url: http://192.168.100.6:30010
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: public