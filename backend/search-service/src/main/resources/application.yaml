spring:
  application:
    name: search-service
  config:
    import: "consul:"
  cloud:
    consul:
      host: 192.168.100.6
      port: 30580
      config:
        format: YAML
        data-key: data
        fail-fast: true
      discovery:
        healthCheckPath: ${server.servletPath}/actuator/health
        healthCheckInterval: 15s

server:
  port: 8081
  servlet:
    context-path: /search-service